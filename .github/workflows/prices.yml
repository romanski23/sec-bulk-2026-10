name: Daily price history (all US-listed SEC filers)

on:
  workflow_dispatch:
    inputs:
      max_tickers:
        description: "Limit tickers (0 = all) for a test run"
        default: "0"
  schedule:
    - cron: '17 4 * * 6'   # Saturdays 04:17 UTC, after Friday's close

permissions:
  contents: write

concurrency:
  group: prices-release
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q "yfinance>=1.7" pandas pyarrow duckdb numpy
      - run: mkdir -p data

      - name: Fetch Yahoo (Stooq fallback)
        run: |
          set -o pipefail
          python prices/fetch.py 2>&1 | tee data/fetch.log
        env:
          MAX_TICKERS: ${{ github.event.inputs.max_tickers || '0' }}

      - name: Build prices.parquet and coverage.csv
        run: |
          set -o pipefail
          python prices/build.py 2>&1 | tee data/build.log
      - name: Summary (readable through the API)
        if: always()
        run: |
          { echo '## fetch'; tail -n 25 data/fetch.log 2>/dev/null; echo; echo '## build'; tail -n 40 data/build.log 2>/dev/null;
            echo; echo '## verify'; cat data/verify_report.txt 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify adjustment, gaps, coverage, cross-check vs sp500-data
        id: verify
        run: python prices/verify.py
        continue-on-error: true

      - name: Publish to release "prices"
        run: |
          gh release create prices --title "Daily price history" --notes "Rebuilt by prices.yml; see verify_report.txt" 2>/dev/null || true
          gh release upload prices data/prices.parquet data/coverage.csv data/fetch_log.csv \
             data/verify_report.txt data/adjustment_check.csv data/gaps_over_30d.csv data/missing_tickers.csv --clobber
          [ -f data/crosscheck_sp500.csv ] && gh release upload prices data/crosscheck_sp500.csv --clobber || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Monthly immutable snapshot
        if: steps.verify.outcome == 'success' && (github.event.inputs.max_tickers || '0') == '0'
        run: |
          TAG="prices-$(date -u +%Y-%m)"
          gh release view "$TAG" >/dev/null 2>&1 && exit 0
          gh release create "$TAG" --title "Prices snapshot $(date -u +%Y-%m)" --notes "Immutable copy, never overwritten." || true
          gh release upload "$TAG" data/prices.parquet data/coverage.csv data/verify_report.txt || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail the run if verification failed
        if: steps.verify.outcome != 'success'
        run: |
          echo "verify.py reported a hard failure; assets were still uploaded so the report can be read"
          exit 1
